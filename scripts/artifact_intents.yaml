schema_version: artifact-intent/v1

# This immutable pre-integration revision keeps the forward gate honest without
# pretending that the legacy corpus has already received exact intent review.
frozen_input:
  revision: "4c8b6311d739cd89576bdd6e9f059a1f391db797"
  command: "git ls-files -z"
  owner: collective-competence

intents:
  - id: generalized-project-wiki-entrypoint
    path: wiki/index.md
    owner: collective-competence
    lifecycle: active
    review_state: reviewed
    authority_type: derived
    purpose_source: wiki/index.md#competence-research--project-wiki
    separate_file_reason: Provides the generalized human and agent front door without making the research roadmap own every concern.
    review_triggers: [agenda_boundary_change, navigation_change, authority_map_change]
    discoverable_from: [README.md, AGENTS.md]

  - id: research-ontology
    path: wiki/ontology.md
    owner: collective-competence
    lifecycle: active
    review_state: reviewed
    authority_type: canonical
    concerns: [research-ontology]
    purpose_source: wiki/ontology.md#research-ontology
    separate_file_reason: Owns the integrated agenda's MECE vocabulary, relationships, claim boundaries, and prospective experiment declaration contract.
    review_triggers: [term_definition_change, research_arm_boundary_change, experiment_contract_change]
    discoverable_from: [wiki/index.md, AGENTS.md]

  - id: development-log
    path: wiki/development-log.md
    owner: collective-competence
    lifecycle: active
    review_state: reviewed
    authority_type: derived
    purpose_source: wiki/development-log.md#development-log
    separate_file_reason: Preserves a referenced account of material evolution without retaining superseded current-state narratives as active guidance.
    review_triggers: [material_documentation_change, authority_migration, archive_disposition]
    discoverable_from: [wiki/index.md, AGENTS.md]

  - id: p15-proposal-layer-benchmark
    path: goal-discovery/docs/hypotheses/p15_proposal_layer_benchmark.md
    owner: collective-competence
    lifecycle: active
    review_state: reviewed
    authority_type: supporting
    purpose_source: goal-discovery/docs/hypotheses/p15_proposal_layer_benchmark.md#p15--blind-proposal-layer-benchmark-on-archived-systems
    separate_file_reason: Freezes the first ontology-consuming experiment protocol separately from mutable priorities and later result evidence.
    review_triggers: [p15_protocol_change, ontology_contract_change, experiment_execution]
    discoverable_from: [wiki/current.md, wiki/index.md]

  - id: laboratory-agent-instruction-source
    path: goal-discovery/AGENTS.md
    owner: collective-competence
    lifecycle: active
    review_state: reviewed
    authority_type: canonical
    purpose_source: goal-discovery/AGENTS.md#laboratory-scope
    separate_file_reason: Carries the authored laboratory instructions.
    review_triggers: [laboratory_instruction_change]
    freshness_check: python3 scripts/check_agent_context.py --check

  - id: documentation-agent-instruction-source
    path: goal-discovery/docs/AGENTS.md
    owner: collective-competence
    lifecycle: active
    review_state: reviewed
    authority_type: canonical
    purpose_source: goal-discovery/docs/AGENTS.md#documentation-and-research-knowledge
    separate_file_reason: Carries the authored documentation instructions.
    review_triggers: [documentation_instruction_change]
    freshness_check: python3 scripts/check_agent_context.py --check

  - id: source-agent-instruction-source
    path: goal-discovery/src/AGENTS.md
    owner: collective-competence
    lifecycle: active
    review_state: reviewed
    authority_type: canonical
    purpose_source: goal-discovery/src/AGENTS.md#simulation-analysis-and-visualization
    separate_file_reason: Carries the authored source instructions.
    review_triggers: [source_instruction_change]
    freshness_check: python3 scripts/check_agent_context.py --check

  - id: test-agent-instruction-source
    path: goal-discovery/tests/AGENTS.md
    owner: collective-competence
    lifecycle: active
    review_state: reviewed
    authority_type: canonical
    purpose_source: goal-discovery/tests/AGENTS.md#evidence-and-verification
    separate_file_reason: Carries the authored test instructions.
    review_triggers: [test_instruction_change]
    freshness_check: python3 scripts/check_agent_context.py --check

  - id: artifact-intent-registry
    path: scripts/artifact_intents.yaml
    owner: collective-competence
    lifecycle: active
    review_state: reviewed
    authority_type: supporting
    purpose_source: roadmap/workflow.md#shared-policy-and-evidence-ownership
    separate_file_reason: Supplies repository-specific reviewed intent data to the shared Project Meta checker without copying shared policy or implementation.
    review_triggers: [new_document_added, document_lifecycle_change, documentation_authority_change]
    discoverable_from: [roadmap/workflow.md]

  - id: evidence-custody-baseline
    path: scripts/evidence_custody_baseline.json
    owner: collective-competence
    lifecycle: active
    review_state: reviewed
    authority_type: supporting
    purpose_source: wiki/development-log.md#2026-09-05--the-evidence-the-frontier-rests-on-was-never-in-git
    separate_file_reason: Records which cited result packages Git does not carry, so acknowledged evidence debt is a tracked fact rather than an invisible one; the gate in scripts/check_evidence_custody.py reads it to distinguish known debt from new drift.
    review_triggers: [result_package_committed, result_package_lost, evidence_citation_added]
    discoverable_from: [wiki/development-log.md, goal-discovery/.gitignore]

families: []
