laboratory_cases:
  - id: heatbugs-blind-calibration
    experiment_id: P4-002
    system: Heatbugs
    generator: NetLogo Heatbugs
    question: Can black-box observations recover authored temperature targets without reading them?
    provenance_state: measured
    evidence_level: held-out calibration
    decision: Promote the blind target estimate on this calibration task; retire further Heatbugs tuning.
    claim_boundary: Calibration demonstrates blinded recovery on one known system, not cross-system representation discovery.
    protocol: docs/hypotheses/p4_002_heatbugs_blind_target_inference.md
    result: docs/hypotheses/p4_002_heatbugs_blind_target_inference_results.md
    data_source: results/p4-002-heatbugs-blind-target-inference-001
    next_decision: Preserve as the black-box/white-box reference; do not optimize it further.
  - id: virus-prospective-selection
    experiment_id: P7-002
    system: Virus on a Network
    generator: NetLogo Virus on a Network
    question: Does a frozen representation-family selector improve untouched intervention prediction?
    provenance_state: contradicted
    evidence_level: frozen prospective
    decision: No-go; identity-conditioned history improved log loss by 8.4%, below the frozen 10% gate.
    claim_boundary: The failed gate rejects promotion and retuning on Virus; it does not show every task-conditioned representation is useless.
    protocol: docs/hypotheses/p7_002_prospective_network_selector.md
    result: docs/hypotheses/p7_002_prospective_network_selector_results.md
    data_source: results/p7-002-network-level2
    next_decision: Preserve as the real evidence-chain reference and generate no more Virus selector outcomes.
  - id: ants-scale-perturbation
    experiment_id: P7-004
    system: Ants
    generator: NetLogo Ants
    question: Does a mesoscopic trail description predict recovery after a frozen trail cut better than simpler alternatives?
    provenance_state: contradicted
    evidence_level: failed intervention integrity; diagnostic scores only
    decision: Stopped on integrity; recorded annulus removal was 24.6% against the 80% gate. Null comparisons are diagnostic only.
    claim_boundary: Invalid intervention does not establish a negative scale result; preserve the original gate and require a fresh protocol for any new test.
    protocol: docs/plans/p7_004_ants_trail_scale_preregistration.md
    result: docs/hypotheses/p7_004_ants_trail_scale_results.md
    data_source: results/p7-004-ants-trail-scale-001
    next_decision: Do not tune or rerun Ants for this question.
  - id: virus-intervention-value
    experiment_id: P7-005
    system: Virus on a Network
    generator: NetLogo Virus on a Network
    question: Does degree-informed immunization robustly beat random immunization at the same budget?
    provenance_state: contradicted
    evidence_level: frozen retrospective causal audit
    decision: Evidence-closed no-go; pooled benefit passed, but seed, budget, and split robustness failed.
    claim_boundary: This closes the current internal V4 route; it is not a universal refutation of network-informed control.
    protocol: docs/plans/p7_005_network_intervention_value_preregistration.md
    result: docs/hypotheses/p7_005_network_intervention_value_results.md
    data_source: results/p7-005-network-intervention-value
    next_decision: Reopen only for a genuinely new causal task or qualified external evidence.
maturity_versions:
  - id: V0
    title: Mature outcome hypothesis
    status: implemented
    becomes_real: The complete decision workflow and its evidence requirements are inspectable; unearned capabilities remain visibly hypothetical.
    exit_decision: Does the proposed interface cover the decisions and evidence needed by the programme without pretending the science exists?
  - id: V1
    title: One real evidence chain
    status: implemented
    becomes_real: P7-002 connects observed behavior, intervention, candidate representations, held-out evidence, a failed gate, and the next decision.
    exit_decision: Can a reader trace a repository-backed result to its claim boundary and next experiment?
  - id: V2
    title: Blind calibration
    status: implemented
    becomes_real: Black-box inference is compared interactively with known white-box ground truth.
    exit_decision: Did the discovery method recover a useful hidden description without reading authored targets?
  - id: V3
    title: Prospective transfer
    status: closed-no-go
    becomes_real: A frozen method is evaluated on untouched outcomes from a different system, or generic selection is closed by a no-go.
    exit_decision: Does the method generalize prospectively or abstain correctly?
  - id: V4
    title: Perturbation and scale
    status: closed-no-go
    becomes_real: Representations are compared for robustness, intervention value, and organizational scale.
    exit_decision: Does a higher-level description add predictive, causal, or control value?
  - id: V5
    title: Competence testing
    status: retired
    becomes_real: The route is explicitly closed when no representation earns the V4 predictive or causal value required to ground a competence test.
    exit_decision: Competence-like language is not licensed on the current evidence; do not build a test merely to fill the version ladder.
  - id: V6
    title: Reusable laboratory
    status: implemented
    becomes_real: Four validated evidence contracts expose question, generator, maturity, decision, claim boundary, sources, and next decision across three systems.
    exit_decision: Reuse the evidence/provenance comparison boundary; keep simulator-specific adapters local.
outcome_map:
  - id: agenda
    section: North star and frontier
    question: What is the programme trying to discover, and what bottleneck currently prevents progress?
    evidence_requirement: An authoritative objective, evidence frontier, active bottleneck, and current sprint that agree.
    capability: Repository-backed research state and roadmap.
    provenance_state: connected
    source: docs/plans/current_research_plan.md
    target_version: V0
    next_test: Reconcile this view after every sprint decision and fail validation on disagreement.
  - id: claim
    section: Claim under consideration
    question: What precise scientific or methodological claim is currently being tested?
    evidence_requirement: A bounded claim, frozen gate, competing explanations, and explicit claim limit.
    capability: Preregistered sprint contract plus decision artifact.
    provenance_state: contradicted
    source: docs/hypotheses/p7_005_network_intervention_value_results.md
    target_version: V4
    next_test: The current internal V4 claim is evidence-closed; reopen only for a genuinely new causal task or qualified external evidence.
  - id: behavior
    section: System behavior and observation boundary
    question: What did the system do, what was observable, and where did intervention begin?
    evidence_requirement: Replayable real trajectories, matched arms, independent seeds, observation cutoff, and intervention marker.
    capability: Validated adapter over NetLogo trajectory and network exports.
    provenance_state: measured
    source: docs/hypotheses/p7_002_prospective_network_selector_results.md
    target_version: V1
    next_test: Retain the P7-002 viewer as the reference evidence chain; do not generate more Virus outcomes.
  - id: representations
    section: Representations and candidate scales
    question: Which observable descriptions compete, and at what organizational scale do they operate?
    evidence_requirement: Candidate definitions linked to the same run and time, capacity disclosure, and a simple matched null.
    capability: Synchronized representation lenses and capacity-matched scoring.
    provenance_state: measured
    source: docs/hypotheses/p7_003_selector_complexity_audit_results.md
    target_version: V3
    next_test: P7-004 found no predictive scale winner; do not run another generic or Ants representation screen.
  - id: perturbation
    section: Perturbation, intervention, prediction, and robustness
    question: Does the proposed description predict untouched intervention outcomes and remain useful under meaningful perturbations?
    evidence_requirement: Matched intervention arms, untouched outcomes, per-unit failures, robustness boundaries, and a frozen promotion threshold.
    capability: Split-aware experiment comparison and perturbation ledger.
    provenance_state: contradicted
    source: docs/hypotheses/p7_005_network_intervention_value_results.md
    target_version: V4
    next_test: Preserve the budget/split sign reversals; do not add Virus outcomes or tune immunization.
  - id: black_white
    section: Black-box discovery versus white-box truth
    question: Does inference from allowed observations recover structure known only from the generator's authored ground truth?
    evidence_requirement: Blinded observation contract, authored target withheld from inference, held-out predictions, and direct error comparison.
    capability: Black-box adapter plus a separately exposed white-box scoring boundary.
    provenance_state: measured
    source: docs/hypotheses/p4_002_heatbugs_blind_target_inference_results.md
    target_version: V2
    next_test: Heatbugs is retired after passing calibration; preserve the linked V2 view as the black-box/white-box reference and do not tune it.
  - id: support_counterevidence
    section: Support, contradiction, and individual failures
    question: What supports the claim, what contradicts it, and which independent cases fail?
    evidence_requirement: Discovery and confirmation separated, null visible, failed seeds inspectable, and post-hoc diagnostics labeled.
    capability: Split-aware score surface with seed drill-down and immutable decision gate.
    provenance_state: contradicted
    source: docs/hypotheses/p7_005_network_intervention_value_results.md
    target_version: V4
    next_test: Preserve the 15.7% pooled effect, failed seed-win gates, and 2/4 sign consistency as the current V4 no-go trail.
  - id: provenance
    section: Provenance and evidence maturity
    question: Where did each value come from, how mature is it, and what decisions may it support?
    evidence_requirement: Source path, evidence level, split, status, claim boundary, and hypothetical labeling for every section.
    capability: Validated outcome-map and research-state contracts.
    provenance_state: connected
    source: docs/research_state.yaml
    target_version: V0
    next_test: Reject non-hypothetical outcome sections without a repository source.
  - id: scale_control
    section: Scale and control value
    question: Does any higher-level description improve prediction, intervention choice, or control beyond simpler alternatives?
    evidence_requirement: Competing scales, matched controls, prospective macro prediction, and intervention-value comparison.
    capability: Retrospective matched intervention audit; no promoted prospective macro predictor exists.
    provenance_state: contradicted
    source: docs/hypotheses/p7_005_network_intervention_value_results.md
    target_version: V4
    next_test: Current internal route is closed; require a genuinely new causal task or qualified external bundle before reopening.
  - id: competence
    section: Competence and alternative routes
    question: Does the system reach a stable outcome through alternative means when familiar routes are blocked, and where does recovery fail?
    evidence_requirement: Blocked-route interventions, alternative means, matched passive controls, recovery boundary, and falsification cases.
    capability: Retired by the licensing rule because V4 promoted no robust predictive or control scale.
    provenance_state: retired
    source: docs/hypotheses/p7_005_network_intervention_value_results.md
    target_version: V5
    next_test: Retirement reason — reopen only after a new V4 route promotes a representation with robust predictive or control value.
  - id: uncertainty
    section: Uncertainty and claim limits
    question: What remains unknown, which explanation is still live, and what is explicitly not licensed?
    evidence_requirement: Failed gates, nulls, sensitivity limits, counterevidence, and locked downstream claims.
    capability: Decision artifacts and machine-readable stop/lock state.
    provenance_state: contradicted
    source: docs/hypotheses/p7_005_network_intervention_value_results.md
    target_version: V4
    next_test: Decide from first principles whether to await external evidence, introduce a genuinely new causal task, or revise the agenda.
  - id: next_test
    section: Next uncertainty-reducing experiment
    question: Which bounded experiment is most likely to change the roadmap now?
    evidence_requirement: Current bottleneck, conditional branches, time cap, stop rule, and expected decision.
    capability: Progress-allocation protocol tied to the active sprint.
    provenance_state: connected
    source: docs/hypotheses/p7_005_network_intervention_value_results.md
    target_version: V0
    next_test: Do not launch another internal V4 experiment until a new causal task or external bundle changes the evidence frontier.
