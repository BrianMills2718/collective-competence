active_sprint:
  id: P9
  status: complete-positive
  title: Blind sorting goal-discovery calibration UI
  evidence_level: engineering-calibration
  question: Can the known sorting system calibrate a blind goal-discovery workflow while making system, environment, boundary, competency, and intervention targets explicit?
  time_cap_minutes: 180
  first_artifact_minutes: 30
  stop_rule: Stop at P9-C1; do not claim automated goal discovery or a general dynamic-environment substrate.
  protocol: docs/roadmaps/p9_sorting_blind_discovery_ui.md
  artifact_standard: docs/plans/dynamic_experiment_artifact_standard.md
  mature_outcome_supported: A sealed calibration workflow that separates candidate goals, representations, mechanisms, invariants, and competencies.
  target_evidence_maturity_version: P9-C1 — blind calibration UI
  placeholder_replaced: Sorting is no longer narrated as a known goal inside the discovery workspace; authored truth is revealed only at calibration.
  result: docs/audits/2026-08-30_p9_c1_blind_sorting_ui.md
next_decisions:
  - condition: P9-C1 demonstrates a coherent sealed candidate-and-intervention workflow
    action: Formalize one held-out blind sorting discovery experiment before transferring claims to another system.
  - condition: The candidate ledger merely relabels known sorting metrics
    action: Retain it as calibration UI only and do not claim goal discovery.
stops:
  - No fourth archive search without newly supplied evidence.
  - No tuning old generators to improve known scores.
  - No decorative or mock dashboard content.
  - No macro causal tooling before a prospective macro predictor.
  - No more Virus or Ants work for the closed V4 internal route.
  - No V5 competence test while V4 remains closed without a promoted scale.
  - No generalized substrate extraction before the complete P8 sorting slice and a passive-bowl second use.
