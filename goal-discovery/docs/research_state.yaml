north_star: >-
  Discover which observable representations and scales make prediction,
  intervention response, control, and collective competence most legible, and
  promote a macro description only when it beats simpler alternatives.
frontier:
  current_unknown: Can a frozen blind-discovery method recover and correctly classify sorting hypotheses on held-out cases without authored rule or target fields?
  bottleneck: P9 demonstrates an intelligible calibration workflow, but its candidate set is hand-authored and no held-out discovery performance has been measured.
  last_learning: Explicit system/environment boundaries and typed matched interventions prevent state recovery, mechanism, invariant, and goal interpretations from being collapsed into one claim.
  external_dependency: None for a separately authorized held-out sorting protocol; P7 science remains evidence-closed.
