[project]
name = "goal-discovery"
version = "0.1.0"
description = "Goal discovery and goal attribution in tiny deterministic systems"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "scikit-learn>=1.6,<2",
    "networkx>=3.4,<4",
]

[project.optional-dependencies]
mesa-spike = [
    "mesa[viz]>=3.3.1,<3.4",
]
visual-workbench = [
    "holoviews>=1.21,<2",
    "hvplot>=0.11,<1",
    "panel>=1.7,<2",
]
representation-discovery = [
    "tsfresh>=0.21,<1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
