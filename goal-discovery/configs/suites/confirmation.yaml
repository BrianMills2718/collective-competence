# Experiment 001, confirmation phase. Rules and thresholds come from
# docs/hypotheses/001_sorting_confirmation.md and are not editable here.
suite: confirmation
phase: confirmation

seeds: {start: 3000, count: 40}   # disjoint from discovery, the burned v1 range, and validation

arms: ["bubble", "insertion", "selection", "random_swap"]
null_arms: ["random_swap"]
null_schedule_matched_to: "bubble"

# C1 -- the paper's replication test. Frozen cells placed before the run starts,
# at the paper's array size, measuring final monotonicity error.
c1_replication:
  n: 100
  order: "shuffled"
  max_ticks: 30000
  freeze_counts: [0, 1, 2, 3]
  freeze_kinds: ["moveable", "immovable"]
  # Reported by Zhang/Goldstein/Levin, Results, "Error tolerance", N=100.
  published:
    moveable:  {bubble: [0.0, 0.8, 2.64], selection: [2.24, 4.36, 13.24]}
    immovable: {bubble: [1.91, 3.72, 5.37], selection: [1.0, 1.96, 2.91]}

# C2 -- mechanism damage applied mid-run, invisible to the state measure.
c2_mechanism:
  n: 40
  order: "shuffled"
  max_ticks: 4000
  branch_timing: 0.9              # late, where validation showed damage is real
  horizon_multiplier: 5
  horizon_minimum: 400
  freeze_counts: [1, 2, 3]
  freeze_kinds: ["moveable", "immovable"]
  state_damage_control: {kind: "block_swap", params: {fraction: 0.20}}
  extra_control: {kind: "randomize_cells", params: {fraction: 0.20}}

# C5 -- do conclusions survive a changed activation order?
c5_order:
  n: 40
  orders: ["shuffled", "index"]
  max_ticks: 4000
