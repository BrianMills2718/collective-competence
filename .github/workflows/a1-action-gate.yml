name: A1 action gate probe

on:
  pull_request:
    branches: [main]

jobs:
  a1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib pytest
      - name: Verify pinned upstream assets
        run: python experiments/12-growing-nca/fetch_upstream.py
      - name: Verify update gate preserves the ungated trajectory
        working-directory: experiments/12-growing-nca
        run: |
          python - <<'PY'
          import numpy as np
          from fetch_upstream import ensure_assets
          from nca_numpy import NCA
          path = ensure_assets()['ex3_lizard.json']
          a = NCA(path, size=32, seed=19)
          b = NCA(path, size=32, seed=19)
          a.run(4)
          ones = np.ones((32, 32), dtype=np.float32)
          for _ in range(4):
              b.step(ones)
          np.testing.assert_array_equal(a.state, b.state)
          assert a.rng.bit_generator.state == b.rng.bit_generator.state
          print('gate identity check: pass')
          PY
      - name: Run preregistered A1 probe
        run: python experiments/12-growing-nca/action_gate_probe.py
      - name: Run existing Experiment 12 tests
        run: python -m pytest -q experiments/12-growing-nca/test_model.py
      - name: Show result
        if: always()
        run: cat experiments/12-growing-nca/results/action_gate_probe.json || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-gate-probe
          path: experiments/12-growing-nca/results/action_gate_probe.json
