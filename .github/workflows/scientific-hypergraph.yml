name: Scientific Hypergraph

on:
  pull_request:
    paths:
      - 'wiki/reference/metamodel/**'
      - 'wiki/reference/scientific-hypergraph-*.md'
      - 'scripts/validate_hypergraph_fixture.py'
      - 'scripts/validate_scientific_hypergraph_suite.py'
      - 'scripts/validate_typed_hypergraph_fixture.py'
      - 'scripts/validate_typed_hypergraph_suite.py'
      - 'scripts/migrate_hypergraph_v0_to_v1.py'
      - 'scripts/check_hypergraph_v1_migration.py'
      - 'scripts/check_hypergraph_v0_role_coverage.py'
      - 'scripts/bootstrap_role_schema_hypergraph.py'
      - 'scripts/generate_role_contracts_from_schema_graph.py'
      - 'scripts/check_role_schema_roundtrip.py'
      - 'scripts/smoke_hypergraph_viewer.mjs'
      - 'scripts/smoke_hypergraph_projections.mjs'
      - 'scripts/smoke_typed_roles.mjs'
      - '.github/workflows/scientific-hypergraph.yml'
  push:
    branches:
      - docs/scientific-metamodel
    paths:
      - 'wiki/reference/metamodel/**'
      - 'scripts/validate_hypergraph_fixture.py'
      - 'scripts/validate_scientific_hypergraph_suite.py'
      - 'scripts/validate_typed_hypergraph_fixture.py'
      - 'scripts/validate_typed_hypergraph_suite.py'
      - 'scripts/migrate_hypergraph_v0_to_v1.py'
      - 'scripts/check_hypergraph_v1_migration.py'
      - 'scripts/check_hypergraph_v0_role_coverage.py'
      - 'scripts/bootstrap_role_schema_hypergraph.py'
      - 'scripts/generate_role_contracts_from_schema_graph.py'
      - 'scripts/check_role_schema_roundtrip.py'
      - 'scripts/smoke_hypergraph_viewer.mjs'
      - 'scripts/smoke_hypergraph_projections.mjs'
      - 'scripts/smoke_typed_roles.mjs'
      - '.github/workflows/scientific-hypergraph.yml'

permissions:
  contents: read

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate v0 scientific-hypergraph fixtures
        run: python scripts/validate_scientific_hypergraph_suite.py
      - name: Check v0 role-contract coverage
        run: python scripts/check_hypergraph_v0_role_coverage.py
      - name: Validate typed-role v1 fixtures
        run: python scripts/validate_typed_hypergraph_suite.py
      - name: Verify generic v0 to v1 migration
        run: python scripts/check_hypergraph_v1_migration.py
      - name: Round-trip role contracts through self-hosted schema graph
        run: python scripts/check_role_schema_roundtrip.py
      - name: Bootstrap self-hosted role schema graph
        run: python scripts/bootstrap_role_schema_hypergraph.py -o artifacts/scientific-role-schema-v1.json
      - name: Re-generate contract index from schema graph artifact
        run: python scripts/generate_role_contracts_from_schema_graph.py artifacts/scientific-role-schema-v1.json -o artifacts/scientific-role-contracts.generated.json
      - name: Compare regenerated contract index semantically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('wiki/reference/metamodel/scientific-role-contracts.json').read_text())
          actual = json.loads(Path('artifacts/scientific-role-contracts.generated.json').read_text())
          if actual != expected:
              raise SystemExit('generated role-contract index differs semantically from committed index')
          print('PASS generated role-contract index is semantically identical to committed index')
          PY
      - name: Upload role schema graph bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: scientific-role-schema-v1
          path: artifacts/scientific-role-schema-v1.json

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Smoke-test exact hypergraph fixtures and layout
        run: node scripts/smoke_hypergraph_viewer.mjs
      - name: Smoke-test named projections and type bundling
        run: node scripts/smoke_hypergraph_projections.mjs
      - name: Smoke-test typed RoleType bindings
        run: node scripts/smoke_typed_roles.mjs
      - name: Upload viewer screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-hypergraph-viewer
          path: artifacts/scientific-hypergraph-viewer.png
          if-no-files-found: ignore
