name: Scientific Hypergraph

on:
  pull_request:
    paths:
      - 'wiki/reference/metamodel/**'
      - 'wiki/reference/scientific-hypergraph-*.md'
      - 'scripts/validate_hypergraph_fixture.py'
      - 'scripts/validate_scientific_hypergraph_suite.py'
      - 'scripts/validate_typed_hypergraph_fixture.py'
      - 'scripts/validate_typed_hypergraph_suite.py'
      - 'scripts/validate_role_schema_graph.py'
      - 'scripts/migrate_hypergraph_v0_to_v1.py'
      - 'scripts/check_hypergraph_v1_migration.py'
      - 'scripts/check_hypergraph_v0_role_coverage.py'
      - 'scripts/check_local_relation_schema.py'
      - 'scripts/check_gauge_equivalence.py'
      - 'scripts/check_stochastic_pde.py'
      - 'scripts/check_uncertain_lineage.py'
      - 'scripts/check_first_class_role_binding.py'
      - 'scripts/check_scientific_hypergraph_queries.py'
      - 'scripts/audit_scientific_hypergraph_adequacy.py'
      - 'scripts/audit_kernel_ablation.py'
      - 'scripts/generate_role_contracts_from_schema_graph.py'
      - 'scripts/check_role_schema_roundtrip.py'
      - 'scripts/smoke_hypergraph_viewer.mjs'
      - 'scripts/smoke_hypergraph_projections.mjs'
      - 'scripts/smoke_typed_roles.mjs'
      - 'scripts/smoke_causal_identifiability.mjs'
      - 'scripts/smoke_dynamic_topology.mjs'
      - 'scripts/smoke_gauge_equivalence.mjs'
      - 'scripts/smoke_stochastic_pde.mjs'
      - 'scripts/smoke_first_class_role_binding.mjs'
      - '.github/workflows/scientific-hypergraph.yml'
  push:
    branches:
      - docs/scientific-metamodel
    paths:
      - 'wiki/reference/metamodel/**'
      - 'scripts/validate_hypergraph_fixture.py'
      - 'scripts/validate_scientific_hypergraph_suite.py'
      - 'scripts/validate_typed_hypergraph_fixture.py'
      - 'scripts/validate_typed_hypergraph_suite.py'
      - 'scripts/validate_role_schema_graph.py'
      - 'scripts/migrate_hypergraph_v0_to_v1.py'
      - 'scripts/check_hypergraph_v1_migration.py'
      - 'scripts/check_hypergraph_v0_role_coverage.py'
      - 'scripts/check_local_relation_schema.py'
      - 'scripts/check_gauge_equivalence.py'
      - 'scripts/check_stochastic_pde.py'
      - 'scripts/check_uncertain_lineage.py'
      - 'scripts/check_first_class_role_binding.py'
      - 'scripts/check_scientific_hypergraph_queries.py'
      - 'scripts/audit_scientific_hypergraph_adequacy.py'
      - 'scripts/audit_kernel_ablation.py'
      - 'scripts/generate_role_contracts_from_schema_graph.py'
      - 'scripts/check_role_schema_roundtrip.py'
      - 'scripts/smoke_hypergraph_viewer.mjs'
      - 'scripts/smoke_hypergraph_projections.mjs'
      - 'scripts/smoke_typed_roles.mjs'
      - 'scripts/smoke_causal_identifiability.mjs'
      - 'scripts/smoke_dynamic_topology.mjs'
      - 'scripts/smoke_gauge_equivalence.mjs'
      - 'scripts/smoke_stochastic_pde.mjs'
      - 'scripts/smoke_first_class_role_binding.mjs'
      - '.github/workflows/scientific-hypergraph.yml'

permissions:
  contents: read

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed self-hosted role schema graph
        run: python scripts/validate_role_schema_graph.py
      - name: Require generated contract cache to match role schema graph
        run: python scripts/check_role_schema_roundtrip.py
      - name: Generate role-contract cache from committed role schema graph
        run: python scripts/generate_role_contracts_from_schema_graph.py wiki/reference/metamodel/scientific-role-schema-v1.json -o artifacts/scientific-role-contracts.generated.json
      - name: Compare generated role-contract cache semantically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          graph_cache = json.loads(Path('artifacts/scientific-role-contracts.generated.json').read_text())
          committed_cache = json.loads(Path('wiki/reference/metamodel/scientific-role-contracts.json').read_text())
          if graph_cache != committed_cache:
              raise SystemExit('scientific-role-contracts.json is stale; regenerate it from scientific-role-schema-v1.json')
          print('PASS role-contract cache is derived exactly from committed role schema graph')
          PY
      - name: Validate v0 scientific-hypergraph fixtures
        run: python scripts/validate_scientific_hypergraph_suite.py
      - name: Check v0 role coverage from committed schema graph
        run: python scripts/check_hypergraph_v0_role_coverage.py
      - name: Validate typed-role v1 fixtures from committed schema graph
        run: python scripts/validate_typed_hypergraph_suite.py
      - name: Verify generic v0 to v1 migration from committed schema graph
        run: python scripts/check_hypergraph_v1_migration.py
      - name: Enforce fixture-local RelationType contracts
        run: python scripts/check_local_relation_schema.py
      - name: Check gauge-equivalent representation semantics
        run: python scripts/check_gauge_equivalence.py
      - name: Check stochastic PDE random-field composition
        run: python scripts/check_stochastic_pde.py
      - name: Check uncertain lineage and identity semantics
        run: python scripts/check_uncertain_lineage.py
      - name: Check first-class RoleBinding semantics
        run: python scripts/check_first_class_role_binding.py
      - name: Check cross-domain scientific queries
        run: python scripts/check_scientific_hypergraph_queries.py
      - name: Audit shared-schema reuse and local-schema pressure
        run: python scripts/audit_scientific_hypergraph_adequacy.py
      - name: Audit candidate kernel primitive ablations
        run: python scripts/audit_kernel_ablation.py

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Smoke-test exact hypergraph fixtures and layout
        run: node scripts/smoke_hypergraph_viewer.mjs
      - name: Smoke-test named projections and type bundling
        run: node scripts/smoke_hypergraph_projections.mjs
      - name: Smoke-test typed RoleType bindings
        run: node scripts/smoke_typed_roles.mjs
      - name: Smoke-test causal observational/interventional identifiability
        run: node scripts/smoke_causal_identifiability.mjs
      - name: Smoke-test fixture-local dynamic topology schema
        run: node scripts/smoke_dynamic_topology.mjs
      - name: Smoke-test gauge-equivalent representations
        run: node scripts/smoke_gauge_equivalence.mjs
      - name: Smoke-test stochastic PDE random-field composition
        run: node scripts/smoke_stochastic_pde.mjs
      - name: Smoke-test first-class RoleBinding inspection
        run: node scripts/smoke_first_class_role_binding.mjs
      - name: Upload viewer screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-hypergraph-viewer
          path: artifacts/scientific-hypergraph-viewer.png
          if-no-files-found: ignore
