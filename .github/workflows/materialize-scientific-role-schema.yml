name: Materialize Scientific Role Schema

on:
  push:
    branches:
      - docs/scientific-metamodel
    paths:
      - 'wiki/reference/metamodel/scientific-role-contracts.json'
      - 'scripts/bootstrap_role_schema_hypergraph.py'
      - 'scripts/generate_role_contracts_from_schema_graph.py'
      - 'scripts/materialize_role_schema_graph.sh'
      - '.github/workflows/materialize-scientific-role-schema.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/scientific-metamodel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize self-hosted role schema graph
        run: bash scripts/materialize_role_schema_graph.sh
      - name: Commit generated role schema graph when changed
        run: |
          if git diff --quiet -- wiki/reference/metamodel/scientific-role-schema-v1.json; then
            echo 'Role schema graph already materialized and current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wiki/reference/metamodel/scientific-role-schema-v1.json
          git commit -m 'Materialize self-hosted scientific role schema graph'
          git push origin HEAD:docs/scientific-metamodel
